[project]
name = "nwtrack"
version = "0.1.0"
description = "Net worth tracker"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.5.0",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.46",
    "textual>=3.0.0",
    "typer>=0.21.1",
]

[project.urls]
Repository = "https://github.com/vgarzon/nwtrack"
Homepage = "https://github.com/vgarzon/nwtrack"

[project.scripts]
nwtrack = "nwtrack.entrypoints.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.mypy]
mypy_path = "src"
exclude_gitignore = true

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
