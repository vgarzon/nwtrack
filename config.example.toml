# Example nwtrack configuration.
#
# Copy this file to one of the following locations (checked in this order;
# the first one found wins), or run `nwtrack config init` to generate one
# with platform-appropriate defaults already filled in:
#
#   1. ./config/nwtrack/config.toml                        (relative to the working
#                                                            directory, e.g. a source
#                                                            checkout)
#   2. ~/.config/nwtrack/config.toml
#   3. ~/Library/Application Support/nwtrack/config.toml   (macOS)
#      ~/.local/share/nwtrack/config.toml                  (Linux, via platformdirs)
#
# To use a file elsewhere, pass `nwtrack --config-file path/to/config.toml ...`
# or set NWTRACK_CONFIG_FILE=path/to/config.toml (the flag wins). An explicit
# file bypasses the search above and must exist.
#
# Every setting below can also be overridden with a shell environment variable
# of the same name, using NWTRACK_<SECTION>__<KEY> (double underscore), e.g.
# NWTRACK_DATABASE__DB_FILE_PATH or NWTRACK_LOGGING__LOG_FILE_LEVEL.
#
# Relative paths (e.g. "./data/sqlite/nwtrack.db") resolve against the current
# working directory at process start, not against this file's location.
#
# db_file_path and log_file are both optional. Omitting a key (or setting it to
# "") falls back to a platformdirs-derived default — see `nwtrack config show`
# for the defaults on your system. The values below are a source-checkout
# example, not required settings.

[database]
db_file_path = "./data/sqlite/nwtrack.db"

[logging]
log_file = "./logs/nwtrack.log"
log_file_level = "INFO"
log_rotation_mb = 10
log_backup_count = 7

[balances]
# Percent change (in either direction) from an account's prior balance that
# triggers a confirmation prompt before saving a balance update, to catch
# typos like entering 1000 instead of 100. Set to 0 to disable the check.
change_warning_threshold_pct = 20.0
